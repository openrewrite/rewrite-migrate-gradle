---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.migrate.GradleBestPractices
displayName: Apply Gradle best practices
description: >-
  Apply the [Gradle best practices](https://docs.gradle.org/current/userguide/best_practices_general.html) that can be
  applied mechanically. Run alongside `org.openrewrite.gradle.GradleBestPractices`, which carries the practices whose
  fix was already a recipe in `rewrite-gradle`. Practices whose fix needs a judgement the build files do not contain
  are deliberately left out, each with its reason below.
recipeList:
  - org.openrewrite.gradle.migrate.wrapper.AddGradleWrapperChecksum
  - org.openrewrite.gradle.migrate.properties.UseUtf8FileEncoding
  - org.openrewrite.gradle.migrate.settings.AddRootProjectName
  - org.openrewrite.gradle.migrate.settings.MoveRepositoriesToSettings
  - org.openrewrite.gradle.migrate.artifacts.RemoveInheritedDependencies
  - org.openrewrite.gradle.migrate.artifacts.RemoveExplicitKotlinStdlibDependency
  - org.openrewrite.gradle.migrate.tasks.RemoveNonReproducibleArchiveSettings
  - org.openrewrite.gradle.migrate.logging.UseLoggingGetLogger
  - org.openrewrite.gradle.migrate.plugins.UsePluginsBlock
  - org.openrewrite.gradle.migrate.plugins.UseWithPluginInsteadOfHasPlugin
  - org.openrewrite.gradle.migrate.tasks.ChangeTaskToTasksRegister
#  - org.openrewrite.gradle.migrate.properties.EnableGradleConfigurationCache  # the catalog's own fix is
#    "add it, then run the build and fix what it surfaces"; a recipe can only do the first half
#  - org.openrewrite.gradle.migrate.tasks.UseDefaultPathSensitivity  # changes task cache keys; a task that writes its
#    input's path into its output would start taking wrong cache hits, silently
#  - org.openrewrite.gradle.UpdateGradleWrapper:  # prefer_bin_distribution; run alongside the wrapper update the
#      distribution: bin                          # Gradle 9 migration already does, the two never settle in one
#                                                 # cycle: whichever runs second finds the BuildTool marker already
#                                                 # bumped and bails, and with no marker the last one simply wins
#  - org.openrewrite.gradle.MigrateDependenciesToVersionCatalog  # use_version_catalogs; it generates camelCase keys
#    (libs.springCore), which contradicts name_version_catalog_entries (spring-core, reached as libs.spring.core)
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.migrate.properties.UseUtf8FileEncoding
displayName: Use UTF-8 file encoding
description: >-
  Append `-Dfile.encoding=UTF-8` to `org.gradle.jvmargs` so the build reads and writes text the same way wherever it
  runs, rather than inheriting whatever default encoding the machine happens to have. Only an existing
  `org.gradle.jvmargs` is appended to: setting that property replaces Gradle's default daemon arguments rather than
  adding to them, so creating it to hold only an encoding would drop the default heap and metaspace settings. An
  encoding already set, UTF-8 or otherwise, is left as it is. See the
  [Gradle best practice](https://docs.gradle.org/current/userguide/best_practices_performance.html#use_utf8_encoding).
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/gradle.properties'
recipeList:
  - org.openrewrite.properties.ChangePropertyValue:
      propertyKey: org.gradle.jvmargs
      oldValue: '^(?!.*-Dfile\.encoding).+$'
      newValue: '$0 -Dfile.encoding=UTF-8'
      regex: true
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.migrate.properties.EnableGradleConfigurationCache
displayName: Enable the Gradle configuration cache
description: >-
  Set `org.gradle.configuration-cache=true` so Gradle can skip the configuration phase when nothing it depends on has
  changed. Deliberately not part of `org.openrewrite.gradle.GradleBestPractices`: enabling it surfaces configuration
  cache violations in build logic that have to be fixed by hand before the build will run, so this is the first half of
  a change whose second half a recipe cannot make. See the
  [Gradle best practice](https://docs.gradle.org/current/userguide/best_practices_performance.html#use_configuration_cache).
recipeList:
  - org.openrewrite.gradle.AddProperty:
      key: org.gradle.configuration-cache
      value: true
      filePattern: gradle.properties
