---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.gradle.migrate.plugins.UpgradePluginsForJava25
displayName: Upgrade third-party plugins and tools for Java 25
description: >-
  Upgrade widely used third-party Gradle plugins, and the tools they run, whose older versions fail when the build
  runs on or compiles for Java 25, staying on the earliest version line that works and preserving newer versions.
  Plugins that break on Gradle 9 itself are upgraded by `org.openrewrite.gradle.migrate.MigrateToGradle9`.
tags:
  - java25
recipeList:
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: net.ltgt.errorprone
      newVersion: 4.1.x
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.gradle.test-retry
      newVersion: 1.6.x
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: com.bmuschko.docker-*-application
      newVersion: 10.0.x
  - org.openrewrite.gradle.migrate.quality.UpgradeSpotBugsToolVersion:
      newVersion: 4.9.x
  - org.openrewrite.gradle.migrate.quality.UpgradeSpotlessGoogleJavaFormat:
      newVersion: 1.27.x
